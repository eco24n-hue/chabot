<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chabot</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1d2129; --muted: #6b7280;
      --user: #2563eb; --user-text: #ffffff; --bot: #eef0f3; --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318; --panel: #1a1d24; --text: #e6e8eb; --muted: #9aa1ab;
        --user: #3b82f6; --user-text: #ffffff; --bot: #252a33; --border: #2c313b;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
      display: flex; justify-content: center;
    }
    .app { width: 100%; max-width: 760px; height: 100%; display: flex; flex-direction: column; }
    header {
      padding: 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 18px; margin: 0; }
    header button {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px;
    }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .msg.error { align-self: center; color: #dc2626; font-size: 14px; background: none; }
    .empty { margin: auto; color: var(--muted); text-align: center; }
    form { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--border); background: var(--panel); }
    textarea {
      flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
      font: inherit; background: var(--bg); color: var(--text); max-height: 160px;
    }
    form button {
      border: none; border-radius: 12px; padding: 0 18px; background: var(--user); color: var(--user-text);
      font-weight: 600; cursor: pointer;
    }
    form button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>💬 Chabot</h1>
      <button id="reset" type="button">새 대화</button>
    </header>
    <div id="messages"><div class="empty">무엇이든 물어보세요.</div></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="메시지를 입력하세요 (Shift+Enter 줄바꿈)"></textarea>
      <button id="send" type="submit">전송</button>
    </form>
  </div>

  <script>
    const $messages = document.getElementById('messages');
    const $form = document.getElementById('form');
    const $input = document.getElementById('input');
    const $send = document.getElementById('send');
    let history = [];

    function addBubble(role, text) {
      document.querySelector('.empty')?.remove();
      const el = document.createElement('div');
      el.className = `msg ${role}`;
      el.textContent = text;
      $messages.appendChild(el);
      $messages.scrollTop = $messages.scrollHeight;
      return el;
    }

    async function send(text) {
      history.push({ role: 'user', content: text });
      addBubble('user', text);
      const bubble = addBubble('assistant', '…');
      $send.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `요청 실패 (${res.status})`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let answer = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          answer += decoder.decode(value, { stream: true });
          bubble.textContent = answer;
          $messages.scrollTop = $messages.scrollHeight;
        }
        if (!answer) throw new Error('응답이 비어 있습니다.');
        history.push({ role: 'assistant', content: answer });
      } catch (e) {
        bubble.remove();
        history.pop();
        addBubble('error', `⚠️ ${e.message}`);
      } finally {
        $send.disabled = false;
        $input.focus();
      }
    }

    $form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = $input.value.trim();
      if (!text || $send.disabled) return;
      $input.value = '';
      $input.style.height = 'auto';
      send(text);
    });

    $input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        $form.requestSubmit();
      }
    });

    $input.addEventListener('input', () => {
      $input.style.height = 'auto';
      $input.style.height = $input.scrollHeight + 'px';
    });

    document.getElementById('reset').addEventListener('click', () => {
      history = [];
      $messages.innerHTML = '<div class="empty">무엇이든 물어보세요.</div>';
    });
  </script>
</body>
</html>
